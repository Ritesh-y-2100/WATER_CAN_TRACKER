<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Can Payment Tracker</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #eef2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 420px;
      width: 100%;
    }
    h2 { text-align: center; color: #007bff; margin-top: 0; }
    
    .card {
      background: #f0f7ff;
      border: 2px solid #007bff;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 20px;
    }
    .current-name {
      font-size: 1.4rem;
      font-weight: bold;
      color: #111;
      margin: 6px 0;
    }
    .upi-info {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 12px;
    }

    .btn-pay {
      display: block;
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .btn-pay:hover { background: #218838; }

    .btn-confirm {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-confirm:hover { background: #0056b3; }

    .section-title { font-weight: bold; margin-top: 24px; color: #444; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
    ul { list-style: none; padding: 0; margin: 10px 0; }
    li {
      padding: 10px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }
    .next-tag { color: #007bff; font-weight: bold; }
    .history-list { font-size: 0.85rem; color: #666; max-height: 120px; overflow-y: auto; }
  </style>
</head>
<body>

<div class="container">
  <h2>🚰 Water Can Tracker</h2>
  
  <div class="card">
    <div>CURRENT TURN TO PAY:</div>
    <div id="currentPayer" class="current-name">---</div>
    <div id="currentUpi" class="upi-info">UPI: ---</div>

    <!-- Direct UPI Payment Button -->
    <a id="payNowBtn" href="#" class="btn-pay">Pay Now via UPI (₹30)</a>

    <!-- Manual Confirmation Button -->
    <button class="btn-confirm" onclick="markPaid()">Mark Paid & Next Turn</button>
  </div>

  <div class="section-title">Rotation Order</div>
  <ul id="membersList"></ul>

  <div class="section-title">Recent Payments</div>
  <ul id="historyList" class="history-list"></ul>
</div>

<script>
  // Add your 10 members with their names and UPI IDs here
  const defaultMembers = [
    { name: "Member 1", upi: "member1@upi" },
    { name: "Member 2", upi: "member2@upi" },
    { name: "Member 3", upi: "member3@upi" },
    { name: "Member 4", upi: "member4@upi" },
    { name: "Member 5", upi: "member5@upi" },
    { name: "Member 6", upi: "member6@upi" },
    { name: "Member 7", upi: "member7@upi" },
    { name: "Member 8", upi: "member8@upi" },
    { name: "Member 9", upi: "member9@upi" },
    { name: "Member 10", upi: "member10@upi" }
  ];

  const WATER_CAN_PRICE = "30"; // Set the cost of 1 water can here

  let members = JSON.parse(localStorage.getItem('water_members_upi')) || defaultMembers;
  let currentIndex = parseInt(localStorage.getItem('water_index_upi')) || 0;
  let history = JSON.parse(localStorage.getItem('water_history_upi')) || [];

  function updateUI() {
    const activeMember = members[currentIndex];

    // Show name and UPI ID
    document.getElementById('currentPayer').innerText = activeMember.name;
    document.getElementById('currentUpi').innerText = `UPI ID: ${activeMember.upi}`;

    // Create Universal UPI Deep Link String
    const upiLink = `upi://pay?pa=${activeMember.upi}&pn=${encodeURIComponent(activeMember.name)}&am=${WATER_CAN_PRICE}&cu=INR&tn=${encodeURIComponent('Water Can Payment')}`;
    
    // Attach deep link to the button
    document.getElementById('payNowBtn').href = upiLink;

    // Render rotation order list
    const membersListEl = document.getElementById('membersList');
    membersListEl.innerHTML = '';
    members.forEach((m, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${index + 1}. ${m.name}</span>`;
      if (index === currentIndex) {
        li.innerHTML += ' <span class="next-tag">(Next Turn)</span>';
      }
      membersListEl.appendChild(li);
    });

    // Render payment history
    const historyListEl = document.getElementById('historyList');
    historyListEl.innerHTML = '';
    history.slice().reverse().forEach(entry => {
      const li = document.createElement('li');
      li.innerText = `${entry.name} paid ₹${WATER_CAN_PRICE} on ${entry.date}`;
      historyListEl.appendChild(li);
    });

    // Save current state locally
    localStorage.setItem('water_members_upi', JSON.stringify(members));
    localStorage.setItem('water_index_upi', currentIndex);
    localStorage.setItem('water_history_upi', JSON.stringify(history));
  }

  function markPaid() {
    const activeMember = members[currentIndex];
    const timestamp = new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    history.push({ name: activeMember.name, date: timestamp });

    // Rotate to next member in queue
    currentIndex = (currentIndex + 1) % members.length;

    updateUI();
  }

  updateUI();
</script>

</body>
</html>
