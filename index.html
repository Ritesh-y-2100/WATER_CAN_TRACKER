<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Can Tracker</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 420px;
      width: 100%;
    }
    h2 { text-align: center; color: #007bff; margin-top: 0; }
    .card {
      background: #e9f5ff;
      border-left: 5px solid #007bff;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      text-align: center;
    }
    .current-name {
      font-size: 1.6rem;
      font-weight: bold;
      color: #2c3e50;
      margin-top: 5px;
    }
    .btn-pay {
      display: block;
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      box-sizing: border-box;
      margin-bottom: 15px;
    }
    .pin-box {
      margin-bottom: 15px;
      text-align: center;
    }
    .pin-box input {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
    }
    .pin-box input:focus {
      border-color: #007bff;
    }
    .btn-confirm {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }
    .section-title { font-weight: bold; margin-top: 25px; color: #555; }
    ul { list-style: none; padding: 0; margin-top: 10px; }
    li {
      padding: 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }
    .next { color: #007bff; font-weight: bold; }
    .history-list { font-size: 0.85rem; color: #666; max-height: 150px; overflow-y: auto; }
    .error-msg { color: #dc3545; font-size: 0.85rem; text-align: center; margin-top: 5px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>🚰 Water Can Tracker</h2>
  
  <div class="card">
    <div>CURRENT TURN TO PAY:</div>
    <div id="currentPayer" class="current-name">---</div>
  </div>

  <!-- Direct UPI Payment Link to Ritesh -->
  <a id="payNowBtn" href="upi://pay?pa=ritesh.y01012008@okicici&pn=WaterCan&am=30&cu=INR" class="btn-pay">Pay Now via UPI (₹30)</a>

  <div class="pin-box">
    <input type="password" id="adminPin" placeholder="Enter Receiver PIN to Confirm" maxlength="4">
    <div id="errorMsg" class="error-msg">Incorrect PIN! Payment not verified.</div>
  </div>

  <button class="btn-confirm" onclick="markPaid()">Confirm & Pass Turn</button>

  <div class="section-title">Rotation Order</div>
  <ul id="membersList"></ul>

  <div class="section-title">Recent Payments</div>
  <ul id="historyList" class="history-list"></ul>
</div>

<script>
  // Receiver Secret PIN (Change 1234 to your choice)
  const SECRET_PIN = "4444";

  // Members list in rotation sequence
  const defaultMembers = [
    "DEVESH",
    "DHANUSH",
    "JAYA SURIYA",
    "LAKSHMI NARAYANAN",
    "MADHAVAN",
    "MADHUSUDHANA",
    "MUKESH EASHWAR",
    "RITESH",
    "RITHICK",
    "UTHAYA MARAN"
  ];

  let members = JSON.parse(localStorage.getItem('water_members')) || defaultMembers;
  let currentIndex = parseInt(localStorage.getItem('water_index')) || 0;
  let history = JSON.parse(localStorage.getItem('water_history')) || [];

  function updateUI() {
    document.getElementById('currentPayer').innerText = members[currentIndex];

    const membersListEl = document.getElementById('membersList');
    membersListEl.innerHTML = '';
    members.forEach((name, index) => {
      const li = document.createElement('li');
      li.innerText = `${index + 1}. ${name}`;
      if (index === currentIndex) {
        li.innerHTML += ' <span class="next">(Next Turn)</span>';
      }
      membersListEl.appendChild(li);
    });

    const historyListEl = document.getElementById('historyList');
    historyListEl.innerHTML = '';
    history.slice().reverse().forEach(entry => {
      const li = document.createElement('li');
      li.innerText = `${entry.name} paid ₹30 on ${entry.date}`;
      historyListEl.appendChild(li);
    });

    localStorage.setItem('water_members', JSON.stringify(members));
    localStorage.setItem('water_index', currentIndex);
    localStorage.setItem('water_history', JSON.stringify(history));
  }

  function markPaid() {
    const enteredPin = document.getElementById('adminPin').value;
    const errorMsgEl = document.getElementById('errorMsg');

    if (enteredPin !== SECRET_PIN) {
      errorMsgEl.style.display = 'block';
      return;
    }

    errorMsgEl.style.display = 'none';
    document.getElementById('adminPin').value = '';

    const paidMember = members[currentIndex];
    const timestamp = new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    history.push({ name: paidMember, date: timestamp });
    currentIndex = (currentIndex + 1) % members.length;

    updateUI();
  }

  updateUI();
</script>

</body>
</html>
